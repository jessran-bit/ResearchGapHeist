name: Referee

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: referee
  cancel-in-progress: false

jobs:
  referee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the submission and update the leaderboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/referee.py
      - name: Save the leaderboard
        run: |
          git config user.name "heist-referee"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LEADERBOARD.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update leaderboard"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 3; done
          exit 1
